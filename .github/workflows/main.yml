# Deploys the repository contents (or a build dir) to GitHub Pages on push to main
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Build (skip if none)
        run: |
          # If you have a build step (e.g. npm run build), replace the lines below.
          # For pure static HTML there is nothing to run.
          echo "No build step configured"
      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v1
        with:
          path: .   # change to ./dist or ./public if you build into a directory
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
